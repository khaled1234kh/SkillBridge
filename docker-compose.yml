services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: skillbridge-app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - skillbridge_data:/app/data
    environment:
      - SKILLBRIDGE_DB=/app/data/skillbridge.db
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import httpx; httpx.get(\"http://localhost:8000/health\", timeout=5)' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  skillbridge_data:
    driver: local